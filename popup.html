<style>

  .header svg { width: 36px; height: 36px; flex: 0 0 36px; border-radius: 8px; }
  .header h3 { margin: 0; font-size: 16px; line-height: 1.3; font-weight: bold; }

  button { width: 100%; margin-top: 10px; padding: 9px; font: inherit; font-weight: 600; border: 0; border-radius: 6px; background: #1a73e8; color: #fff; cursor: pointer; }
  button:disabled { background: #9bb6da; cursor: default; }
  .hint { color: #888; font-size: 11px; margin-top: 8px; line-height: 1.5; }
  #status { margin-top: 10px; font-size: 12px; line-height: 1.5; color: #333; white-space: pre-wrap; min-height: 16px; }
</style>
</head>
